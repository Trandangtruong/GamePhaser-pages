<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GamePhaser</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a222c;
      --text: #e8eef4;
      --muted: #8b9aab;
      --accent: #3d9cf0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: radial-gradient(1200px 600px at 10% -10%, #1c3348, var(--bg));
      color: var(--text);
    }
    main {
      max-width: 640px;
      margin: 0 auto;
      padding: 48px 20px 64px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    p {
      margin: 0 0 28px;
      color: var(--muted);
      line-height: 1.5;
    }
    ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 12px;
    }
    a.game {
      display: block;
      padding: 16px 18px;
      background: var(--panel);
      border: 1px solid #2a3542;
      border-radius: 10px;
      color: var(--text);
      text-decoration: none;
      transition: border-color 0.15s, transform 0.15s;
    }
    a.game:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }
    a.game strong {
      display: block;
      font-size: 1.05rem;
      margin-bottom: 4px;
    }
    a.game span {
      color: var(--muted);
      font-size: 0.875rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>GamePhaser</h1>
    <p>Hub GitHub Pages — mỗi game nằm trong một thư mục riêng. Cập nhật chỉ cần thay thư mục đó rồi push.</p>
    <ul>
      <li>
        <a class="game" href="./food/">
          <strong>Foodie Match</strong>
          <span>./food/</span>
        </a>
      </li>
      <li>
        <a class="game" href="./title/">
          <strong>Tile Trip</strong>
          <span>./title/</span>
        </a>
      </li>
    </ul>
  </main>
</body>
</html>
